name: Build Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python audit.py
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Slayers2Macro-Windows
          path: |
            dist/Slayers2Macro.zip
            dist/Slayers2Macro.zip.sha256
            dist/Atualizador.zip
      - name: Publicar versão marcada
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create $env:RELEASE_TAG dist/Slayers2Macro.zip dist/Slayers2Macro.zip.sha256 dist/Atualizador.zip --generate-notes
